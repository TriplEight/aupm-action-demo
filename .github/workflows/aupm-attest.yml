name: aupm-attest
run-name: aupm-attest on ${{ inputs.network || 'mainnet' }}

# Third-party donor demo for AuPM on Algorand.
# Push and pull_request runs target MainNet and pay REAL USDC.
# A TestNet rehearsal runs only from workflow_dispatch with network: testnet.
# Trigger on push, pull_request and workflow_dispatch only: the facilitator
# classifies scheduled runs as DEV traffic.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      network:
        description: 'Algorand network. mainnet pays real USDC.'
        type: choice
        options: [mainnet, testnet]
        default: mainnet

permissions:
  contents: read

jobs:
  attest:
    name: attest on ${{ inputs.network || 'mainnet' }}
    runs-on: ubuntu-24.04
    env:
      # The donor code in the action reads NETWORK. Set it on every run, so
      # the network is explicit in the log.
      NETWORK: ${{ inputs.network || 'mainnet' }}
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned to a full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: AuPM attestation (donates on ${{ env.NETWORK }})
        uses: TriplEight/AuPM/.github/actions/aupm-attest@a7df68048d8ffc83d6d0c37c5ce46df634c9d3b9 # master after PR #64
        with:
          endpoint: ${{ env.NETWORK == 'testnet' && vars.AUPM_ENDPOINT_TESTNET || 'https://aupm.fyi' }}
          lockfile: package-lock.json
          donate: 'true'
          donor-mnemonic: ${{ env.NETWORK == 'testnet' && secrets.AUPM_DONOR_MNEMONIC_TESTNET || secrets.AUPM_DONOR_MNEMONIC_MAINNET }}

      - name: Upload the attestation (${{ env.NETWORK }})
        # actions/upload-artifact v7.0.1, pinned to a full commit SHA.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aupm-attestation-${{ env.NETWORK }}
          path: aupm-attestation.json
          # warn, not error: with no donor secret (a fork pull_request) the
          # action writes no file, and the job must stay green.
          if-no-files-found: warn
